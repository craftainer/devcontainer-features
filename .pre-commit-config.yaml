# Run with prek (https://prek.j178.dev/, a Rust, drop-in-compatible
# reimplementation of pre-commit — see CLAUDE.md for why) or with the
# classic `pre-commit` CLI; both read this exact file.
#
# Fast, basic checks run on every commit. Every hook also carries the
# "manual" stage, so `prek run --hook-stage manual --all-files` runs
# everything at once regardless of which git hook would normally trigger
# it. An instance layers its own language-specific hooks (ruff/mypy/
# pytest, cargo fmt/clippy, golangci-lint, eslint/tsc, tflint, ...) onto
# this file's `repos:` list — see docs/TEMPLATE.md's "Checks" section.
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit, manual]
      - id: end-of-file-fixer
        stages: [pre-commit, manual]
      - id: check-yaml
        stages: [pre-commit, manual]
      - id: check-toml
        stages: [pre-commit, manual]
      - id: check-json
        stages: [pre-commit, manual]
      - id: check-added-large-files
        stages: [pre-commit, manual]
      - id: check-merge-conflict
        stages: [pre-commit, manual]
      - id: mixed-line-ending
        stages: [pre-commit, manual]
      - id: debug-statements
        stages: [pre-commit, manual]
      - id: detect-private-key
        stages: [pre-commit, manual]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      # No "manual" stage here, unlike every other hook in this file: this
      # one needs the actual commit-message file git passes at the
      # commit-msg stage, which "prek run --all-files --hook-stage manual"
      # has no equivalent for.
      - id: conventional-pre-commit
        stages: [commit-msg]

  # This instance's own hooks: the features' shell code.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: shellcheck (features, install-lib, check scripts)
        # install-lib.sh declares its shell (bash) with a directive;
        # --external-sources lets install.sh follow its sourced copy.
        args: [--external-sources, --source-path=SCRIPTDIR]
        files: ^(src/.*|common/[^/]*|scripts/check-[^/]*)\.sh$
        stages: [pre-commit, manual]

  - repo: local
    hooks:
      - id: template-sync-manifest
        name: template-sync-manifest (every tracked path classified)
        entry: python3 .github/scripts/template_sync_manifest.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: scripts-tests
        name: scripts-tests (.github/scripts unit tests, executable bits)
        entry: env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p "test_*.py"
        language: system
        files: ^(\.github/(scripts|workflows)/|\.claude/hooks/|Makefile$)
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: devcontainer-lock
        name: devcontainer-lock (lockfile matches devcontainer.json features)
        entry: python3 .github/scripts/check_devcontainer_lock.py
        language: system
        files: ^\.devcontainer/devcontainer(-lock)?\.json$
        pass_filenames: false
        stages: [pre-commit, manual]

      # This instance's own local hooks (see
      # docs/adrs/0001-one-collection-repo-released-with-devcontainers-action.md).
      - id: install-lib-drift
        name: install-lib-drift (src/*/install-lib.sh match common/)
        entry: scripts/check-install-lib-drift.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: feature-options
        name: feature-options (pin options default to the empty string)
        entry: scripts/check-feature-options.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: version-bump
        name: version-bump (changed features raise their version vs origin/main)
        entry: scripts/check-version-bump.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]
