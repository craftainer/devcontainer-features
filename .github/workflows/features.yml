# Validates, tests and publishes this collection's Dev Container Features
# with devcontainers/action and the Dev Container CLI, modeled on the
# official feature-starter and devcontainers/features' test-all.yaml (see
# docs/adrs/0001-one-collection-repo-released-with-devcontainers-action.md).
# Instance-owned: listed in .github/template-sync-manifest.local.yml.
#
# - Pull requests: validate every devcontainer-feature.json, and check that
#   each changed feature raised its version (scripts/check-version-bump.sh).
# - Pull requests and main: run every feature's scenarios on each base
#   image, natively on amd64 and arm64, plus the _global scenarios.
# - main: publish each feature whose version is new to
#   ghcr.io/<owner>/<repo>/<id>, then open a PR with the regenerated
#   src/<id>/README.md files.
#
# With no features under src/ yet, every job but version-bump is skipped.
name: Features

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default. Only the publish job asks for
# more, and the repo's default token stays read-only.
permissions:
  contents: read

env:
  # Same version as scripts/develop.d/10-devcontainer-cli.sh; Renovate bumps
  # both in the same PR.
  # renovate: datasource=npm depName=@devcontainers/cli
  DEVCONTAINER_CLI_VERSION: 0.89.0

jobs:
  discover:
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      features: ${{ steps.list.outputs.features }}
      global: ${{ steps.list.outputs.global }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A feature is a src/<id>/ with a devcontainer-feature.json. The ids
      # become a JSON array for the test matrix; [] when there are none.
      - name: List features
        id: list
        run: |
          shopt -s nullglob
          ids=()
          for meta in src/*/devcontainer-feature.json; do
            id="${meta#src/}" id="${id%%/*}"
            [[ "$id" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::invalid feature id '$id'"; exit 1; }
            ids+=("$id")
          done
          features="$(printf '%s\n' "${ids[@]}" | jq -Rsc 'split("\n") | map(select(. != ""))')"
          global=false
          [ -f test/_global/scenarios.json ] && global=true
          echo "features=${features}" >>"$GITHUB_OUTPUT"
          echo "global=${global}" >>"$GITHUB_OUTPUT"
          echo "features: ${features}, global scenarios: ${global}"

  validate:
    needs: discover
    if: github.event_name == 'pull_request' && needs.discover.outputs.features != '[]'
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate devcontainer-feature.json files
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: ./src
          devcontainer-cli-version: ${{ env.DEVCONTAINER_CLI_VERSION }}

  # The prek run in checks.yml has a depth-1 checkout without origin/main,
  # so the hook skips there; this job is where the check is enforced.
  version-bump:
    if: github.event_name == 'pull_request'
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that changed features raised their version
        env:
          VERSION_BUMP_BASE: origin/${{ github.base_ref }}
          VERSION_BUMP_REQUIRE_BASE: "1"
        run: scripts/check-version-bump.sh

  # Scenarios only (--skip-autogenerated): the autogenerated test installs
  # a feature with its default options, and these features have no default
  # pins, so it would always fail. Instead each scenario is pointed at the
  # matrix base image (docs/adrs/0002-resolve-pins-from-option-env-or-pins-file-with-no-defaults.md).
  test:
    needs: discover
    if: needs.discover.outputs.features != '[]'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.discover.outputs.features) }}
        image:
          - mcr.microsoft.com/devcontainers/base:trixie
          - mcr.microsoft.com/devcontainers/base:noble
          - debian:13
          - ubuntu:24.04
        platform:
          - arch: amd64
            # renovate: datasource=github-runners depName=ubuntu
            runner: ${{ vars.CI_RUNNER_AMD64 || 'ubuntu-24.04' }}
          - arch: arm64
            # renovate: datasource=github-runners depName=ubuntu
            runner: ${{ vars.CI_RUNNER_ARM64 || 'ubuntu-24.04-arm' }}
    name: test (${{ matrix.feature }}, ${{ matrix.image }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    env:
      FEATURE: ${{ matrix.feature }}
      BASE_IMAGE: ${{ matrix.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Dev Container CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      # An "image" scenario gets the matrix image; a "build" scenario gets
      # it as the BASE_IMAGE build arg (its Dockerfile starts with
      # ARG BASE_IMAGE / FROM ${BASE_IMAGE}).
      - name: Point the scenarios at ${{ matrix.image }}
        run: |
          f="test/${FEATURE}/scenarios.json"
          if [ ! -f "$f" ]; then
            echo "::error file=src/${FEATURE}/devcontainer-feature.json::${f} is missing; every feature needs scenarios (the autogenerated test is skipped, see docs/adrs/0002-resolve-pins-from-option-env-or-pins-file-with-no-defaults.md)"
            exit 1
          fi
          if jq -e 'length == 0' "$f" >/dev/null; then
            echo "::error file=${f}::${f} has no scenarios; --skip-autogenerated would run nothing"
            exit 1
          fi
          if jq -e 'any(.[]; has("dockerFile"))' "$f" >/dev/null; then
            echo "::error file=${f}::a scenario uses the legacy top-level dockerFile; use build.dockerfile with ARG BASE_IMAGE"
            exit 1
          fi
          jq --arg img "$BASE_IMAGE" \
            'map_values(if has("build") then .build.args.BASE_IMAGE = $img else .image = $img end)' \
            "$f" >"$f.tmp"
          mv "$f.tmp" "$f"

      - name: Test ${{ matrix.feature }} scenarios
        run: devcontainer features test --features "$FEATURE" --skip-autogenerated .

  test-global:
    needs: discover
    if: needs.discover.outputs.global == 'true'
    strategy:
      fail-fast: false
      matrix:
        image:
          - mcr.microsoft.com/devcontainers/base:trixie
          - mcr.microsoft.com/devcontainers/base:noble
          - debian:13
          - ubuntu:24.04
        platform:
          - arch: amd64
            # renovate: datasource=github-runners depName=ubuntu
            runner: ${{ vars.CI_RUNNER_AMD64 || 'ubuntu-24.04' }}
          - arch: arm64
            # renovate: datasource=github-runners depName=ubuntu
            runner: ${{ vars.CI_RUNNER_ARM64 || 'ubuntu-24.04-arm' }}
    name: test-global (${{ matrix.image }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    env:
      BASE_IMAGE: ${{ matrix.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Dev Container CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: Point the scenarios at ${{ matrix.image }}
        run: |
          f=test/_global/scenarios.json
          if jq -e 'length == 0' "$f" >/dev/null; then
            echo "::error file=${f}::${f} has no scenarios; --global-scenarios-only would run nothing"
            exit 1
          fi
          if jq -e 'any(.[]; has("dockerFile"))' "$f" >/dev/null; then
            echo "::error file=${f}::a scenario uses the legacy top-level dockerFile; use build.dockerfile with ARG BASE_IMAGE"
            exit 1
          fi
          jq --arg img "$BASE_IMAGE" \
            'map_values(if has("build") then .build.args.BASE_IMAGE = $img else .image = $img end)' \
            "$f" >"$f.tmp"
          mv "$f.tmp" "$f"

      - name: Test global scenarios
        run: devcontainer features test --global-scenarios-only .

  publish:
    needs: [discover, test, test-global]
    # Runs after the tests pass; a skipped test-global (no _global
    # scenarios) doesn't block it.
    if: >-
      !cancelled() && !failure()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.discover.outputs.features != '[]'
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    concurrency:
      group: features-publish
      cancel-in-progress: false
    permissions:
      # The feature packages on GHCR.
      packages: write
      # devcontainers/action tags each release (<id>_v<version>), and the
      # docs step pushes a branch.
      contents: write
      # The docs step opens a PR.
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish features
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          publish-features: "true"
          base-path-to-features: ./src
          generate-docs: "true"
          devcontainer-cli-version: ${{ env.DEVCONTAINER_CLI_VERSION }}

      # generate-docs only writes src/<id>/README.md; it doesn't commit.
      # A PR opened with GITHUB_TOKEN doesn't trigger workflows, so its
      # checks have to be started by hand (or by pushing to its branch).
      - name: Open a PR with the regenerated feature READMEs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- 'src/*/README.md')" ]; then
            echo "Feature READMEs unchanged."
            exit 0
          fi
          branch="automated-docs-update-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- 'src/*/README.md'
          git commit -m 'docs: regenerate feature READMEs'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'docs: regenerate feature READMEs' \
            --body 'Generated by devcontainers/action generate-docs in features.yml after a publish.'
