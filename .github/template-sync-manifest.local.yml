# This instance's own paths, which template-base's manifest
# (template-sync-manifest.yml) can't know about. "ignore" tier only, in the
# same pattern syntax. Only the completeness check
# (.github/scripts/template_sync_manifest.py) reads this file; template
# sync touches only paths the base manifest classifies, so it leaves these
# alone.

ignore:
  # The features themselves, their tests, and the shared install library
  # copied into each feature.
  - src/
  - test/
  - common/

  # Validates, tests and publishes the features with devcontainers/action
  # (see docs/adrs/0001-one-collection-repo-released-with-devcontainers-action.md).
  - .github/workflows/features.yml

  # The local prek hooks' scripts (install-lib copy drift, feature options,
  # version bump);
  # wired up in .pre-commit-config.yaml, which is merge tier, so sync keeps
  # those hook entries.
  - scripts/check-*.sh

  # The Dev Container CLI hook. Base's scripts/develop.d/*.sh already
  # ignores it; listed here too so this file names everything this repo adds.
  - scripts/develop.d/10-devcontainer-cli.sh
